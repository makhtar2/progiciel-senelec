<div class="carte">
  <p class="caption">La prime fixe rémunère la puissance mise à disposition : une puissance souscrite trop élevée gonfle la facture, trop faible elle déclenche des pénalités de dépassement. La courbe ci-dessous parcourt les valeurs possibles et repère le minimum.</p>
  <form hx-post="/optimisation/ps/calculer" hx-target="#ps-resultats" hx-swap="innerHTML"
        hx-trigger="change, keyup delay:500ms changed">
    <div class="grille grille--2">
      <div class="champ">
        <label for="ps-code">Option tarifaire</label>
        <select name="code" id="ps-code">
          {% for c, tarif in tarifs_sp.items() %}
          <option value="{{ c }}" {{ 'selected' if c == code else '' }}>{{ c }} — {{ tarif.libelle }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="champ">
        <label for="ps-actuelle">Puissance souscrite actuelle (kW)</label>
        <input type="number" name="ps_actuelle" id="ps-actuelle" min="1" step="10" value="{{ ps_actuelle }}">
      </div>
      <div class="champ" style="grid-column: 1 / -1;">
        <label for="ps-saisie">Puissances maximales relevées sur 12 mois (kW, séparées par des virgules)</label>
        <input type="text" name="saisie" id="ps-saisie" value="{{ saisie }}">
      </div>
    </div>
  </form>
</div>

<div id="ps-resultats">
  {% include "_optimisation_ps_resultats.html" %}
</div>
